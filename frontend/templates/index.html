<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Prediction</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet">
    <style>
        body {
            background-color: #e6f2ff;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 500px;
            margin-top: 50px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0077cc;
        }
        .btn-primary {
            background-color: #66b3ff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #3399ff;
        }
        .result-box, .error-box {
            padding: 10px;
            margin-top: 15px;
            border-radius: 6px;
        }
        .result-box {
            background-color: #f0f9ff;
            border: 1px solid #cce5ff;
        }
        .error-box {
            background-color: #ffe6e6;
            border: 1px solid #ffb3b3;
            color: #cc0000;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Weather Prediction</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="humidity" class="form-label">Humidity (%)</label>
            <input type="number" step="0.1" name="humidity" id="humidity" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="windSpeed" class="form-label">Wind Speed (km/h)</label>
            <input type="number" step="0.1" name="windSpeed" id="windSpeed" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <select name="city" id="city" class="form-select" required>
    <option value="" disabled selected>Select a city</option>
    <option value="London">London</option>
    <option value="New York">New York</option>
    <option value="Tokyo">Tokyo</option>
    <option value="Paris">Paris</option>
    <option value="Sydney">Sydney</option>
</select>

        </div>
        <div class="mb-3">
            <label for="day" class="form-label">Day (0=Sun, 6=Sat)</label>
            <input type="number" min="0" max="6" name="day" id="day" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="hour" class="form-label">Hour (0-23)</label>
            <input type="number" min="0" max="23" name="hour" id="hour" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Predict</button>
    </form>

    {% if prediction %}
    <div class="result-box mt-4">
        <strong>Prediction:</strong> {{ prediction }}
    </div>
    {% endif %}

    {% if error %}
    <div class="error-box mt-4">
        <strong>Error:</strong> {{ error }}
    </div>
    {% endif %}
</div>
</body>
</html>
