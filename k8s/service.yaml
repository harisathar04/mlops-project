apiVersion: v1
kind: Service
metadata:
  name: flask-frontend-service
spec:
  type: NodePort
  selector:
    app: flask-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: node-backend-service
spec:
  type: ClusterIP
  selector:
    app: flask-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000