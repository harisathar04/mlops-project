name: Dev - Lint and Sanity Check

on:
  push:
    branches: [dev2]

jobs:
  dev-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas flask
        npm install
        pip install flake8

    - name: Lint code
      run: flake8 --ignore=E501 model/app.py model/model_training.py model/preprocess.py predict.py dags/weather_dag.py

    - name: Run training script (sanity)
      run: |
        python train_model.py --dev