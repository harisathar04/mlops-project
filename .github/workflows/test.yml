name: Test - Run Tests on Test Branch

on:
  pull_request:
    branches:
      - test 

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas flask pytest joblib
        npm install

    - name: Start Node.js server
      run: |
        nohup node server.js &  # Start the Node.js server in the background

    - name: Run the model via cURL
      run: |
        curl -X POST http://localhost:5001/predict \
        -H "Content-Type: application/json" \
        -d '{
          "humidity": 60,
          "windSpeed": 3.2,
          "city": "Tokyo",
          "day": 4,
          "hour": 10
        }'
