name: Test - Run Tests on Test Branch

on:
  pull_request:
    branches:
      - prod 

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas flask pytest joblib
        npm install

    - name: Start Node server
      run: |
        nohup node server.js > server.log 2>&1 &
        for i in {1..15}; do
          nc -z localhost 5001 && echo "Server is up!" && break
          echo "Waiting for server..."
          sleep 2
        done
        cat server.log  # Optional: View server logs for debugging
        
    - name: Run the model via cURL
      run: |
        curl -X POST http://localhost:5001/predict \
        -H "Content-Type: application/json" \
        -d '{
          "humidity": 60,
          "windSpeed": 3.2,
          "city": "Tokyo",
          "day": 4,
          "hour": 10
        }'
